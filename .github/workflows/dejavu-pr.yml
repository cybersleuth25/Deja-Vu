name: DejaVu PR check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  incident-history:
    runs-on: ubuntu-latest
    steps:
      # Check out the base branch, not the PR. The script and data/incidents.json then come from
      # reviewed code, so a PR cannot edit the incident history (or the script) to hide its own
      # warning. Only the list of changed file names is taken from the PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: List changed files
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          git diff --name-only "${BASE_SHA}...pr/head" > changed.txt
          cat changed.txt

      - name: Comment with incident history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/pr_comment.py --files-from changed.txt
